[supervisord]
nodaemon=true
user=monitoring
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:prometheus]
command=/opt/prometheus/prometheus
    --config.file=/etc/prometheus/prometheus.yml
    --storage.tsdb.path=/var/lib/prometheus/data
    --storage.tsdb.retention.time=15d
    --web.console.libraries=/opt/prometheus/console_libraries
    --web.console.templates=/opt/prometheus/consoles
    --web.listen-address=0.0.0.0:9090
    --web.enable-lifecycle
    --log.level=info
directory=/opt/prometheus
user=monitoring
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/prometheus.err.log
stdout_logfile=/var/log/supervisor/prometheus.out.log
environment=HOME="/home/monitoring",USER="monitoring"

[program:grafana]
command=/opt/grafana/bin/grafana-server
    --homepath=/opt/grafana
    --config=/etc/grafana/grafana.ini
directory=/opt/grafana
user=monitoring
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/grafana.err.log
stdout_logfile=/var/log/supervisor/grafana.out.log
environment=HOME="/home/monitoring",USER="monitoring",GF_PATHS_DATA="/var/lib/grafana/data",GF_PATHS_LOGS="/var/log/grafana"