version: '3.8'

# Production overrides for MLX Distributed Inference
services:
  redis:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    volumes:
      - redis_data:/data
      - ./config/redis/redis-prod.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly yes

  coordinator:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - LOG_LEVEL=WARNING
      - MAX_WORKERS=500
      - HEALTH_CHECK_INTERVAL=15
      - WORKER_TIMEOUT=30
      - ENABLE_METRICS_AUTH=true
      - METRICS_AUTH_TOKEN=${METRICS_AUTH_TOKEN}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      - WORKERS=4
      - LOG_LEVEL=warning
      - ENABLE_AUTH=true
      - API_KEYS=${API_KEYS}
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=1000
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    volumes:
      - ./config/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - /var/log/nginx:/var/log/nginx
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=1024

  monitoring:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    environment:
      - PROMETHEUS_RETENTION=30d
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/ssl/grafana.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/ssl/grafana.key
    volumes:
      - prometheus_data:/var/lib/prometheus/data
      - grafana_data:/var/lib/grafana/data
      - ./config/prometheus:/etc/prometheus:ro
      - ./config/grafana:/etc/grafana:ro
      - ./config/grafana/ssl:/etc/grafana/ssl:ro

  jaeger:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    environment:
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      - ES_USERNAME=${ELASTICSEARCH_USERNAME:-}
      - ES_PASSWORD=${ELASTICSEARCH_PASSWORD:-}