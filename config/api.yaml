# MLX Distributed Inference API Server Configuration

# Server settings
server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  reload: false

# Coordinator connection
coordinator:
  host: "localhost"
  port: 50051
  timeout: 30
  max_retries: 3
  retry_delay: 1.0

# Authentication and security
auth:
  enabled: false
  api_keys: []
  jwt_secret: null
  jwt_algorithm: "HS256"
  jwt_expiration: 3600

# Rate limiting
rate_limiting:
  enabled: true
  requests_per_minute: 100
  burst_size: 20
  per_client: true

# CORS settings
cors:
  enabled: true
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "OPTIONS"]
  allow_headers: ["*"]
  allow_credentials: false

# Logging
logging:
  level: "INFO"
  format: "json"
  file: null
  max_size_mb: 100
  backup_count: 5

# Monitoring
monitoring:
  metrics_enabled: true
  metrics_port: 9090
  tracing_enabled: true
  jaeger_endpoint: "http://jaeger:14268/api/traces"
  health_check_interval: 30

# Streaming
streaming:
  chunk_size: 1024
  timeout: 300
  buffer_size: 8192
  heartbeat_interval: 30

# Performance
performance:
  max_connections: 1000
  connection_timeout: 30
  request_timeout: 300
  worker_processes: 1