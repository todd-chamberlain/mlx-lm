# MLX Distributed Inference Configuration

# Server settings
server:
  host: "0.0.0.0"
  port: 8080
  
# Node configuration
nodes:
  - id: "node-1"
    address: "10.201.20.10:50052"
  - id: "node-2"
    address: "10.201.20.12:50052"

# Model settings
model:
  default: "mlx-community/Llama-3.2-3B-Instruct-4bit"
  cache_dir: "~/.cache/huggingface"
  
# Pipeline settings
pipeline:
  strategy: "balanced"  # balanced, memory_aware, custom
  
# Performance settings
performance:
  max_concurrent_requests: 10
  drain_timeout: 30
  
# Logging
logging:
  level: "INFO"
  file: "/tmp/distributed_server.log"
