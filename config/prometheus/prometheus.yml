# Prometheus configuration for MLX Distributed Inference
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Server metrics
  - job_name: 'api-server'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Coordinator service metrics
  - job_name: 'coordinator'
    static_configs:
      - targets: ['coordinator:9091']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # MLX Workers - these will be discovered dynamically
  # For now, we'll use static configuration for common worker ports
  - job_name: 'mlx-workers'
    static_configs:
      # These should be updated based on your actual worker deployments
      - targets: 
        - 'host.docker.internal:9092'  # Worker 1
        - 'host.docker.internal:9093'  # Worker 2
        - 'host.docker.internal:9094'  # Worker 3
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Redis metrics (if using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # System metrics (if using node_exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
    metrics_path: '/metrics'
    scrape_interval: 30s

# Remote write configuration (optional - for long-term storage)
# remote_write:
#   - url: "http://remote-storage:9201/write"

# Remote read configuration (optional)
# remote_read:
#   - url: "http://remote-storage:9201/read"