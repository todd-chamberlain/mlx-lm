# Redis production configuration for MLX Distributed Inference

# Network
bind 0.0.0.0
port 6379
timeout 300

# Memory management - increased for production
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence - more frequent saves for production
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Security - enable authentication in production
# requirepass ${REDIS_PASSWORD}

# Performance tuning for production
tcp-keepalive 300
tcp-backlog 511
databases 16

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN SHUTDOWN_MLX_REDIS

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100