syntax = "proto3";

package mlx_inference;

// Coordinator Service - manages workers and routes requests
service CoordinatorService {
    rpc RegisterWorker(WorkerRegistration) returns (RegistrationResponse);
    rpc RouteInference(InferenceRequest) returns (InferenceResponse);
    rpc StreamInference(InferenceRequest) returns (stream StreamChunk);
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
    rpc DownloadModel(ModelDownloadRequest) returns (ModelDownloadResponse);
    rpc GetDownloadStatus(ModelStatusRequest) returns (ModelStatusResponse);
    rpc DeleteModel(ModelDeleteRequest) returns (ModelDeleteResponse);
    rpc GetShardStatus(ShardStatusRequest) returns (ShardStatusResponse);
}

// Inference Service - runs on MLX workers
service InferenceService {
    rpc ProcessInference(InferenceRequest) returns (InferenceResponse);
    rpc StreamInference(InferenceRequest) returns (stream StreamChunk);
    rpc HealthCheck(Empty) returns (HealthStatus);
    rpc GetMetrics(Empty) returns (WorkerMetrics);
    rpc DownloadModel(ModelDownloadRequest) returns (ModelDownloadResponse);
    rpc GetModelStatus(ModelStatusRequest) returns (ModelStatusResponse);
    rpc DeleteModel(ModelDeleteRequest) returns (ModelDeleteResponse);
}

// Core request/response messages
message InferenceRequest {
    string request_id = 1;
    string prompt = 2;
    int32 max_tokens = 3;
    float temperature = 4;
    float top_p = 5;
    int32 seed = 6;
    string model = 7;
    bool use_cache = 8;
}

message InferenceResponse {
    string request_id = 1;
    string text = 2;
    repeated int32 tokens = 3;
    int32 prompt_tokens = 4;
    int32 completion_tokens = 5;
    float tokens_per_second = 6;
    string worker_id = 7;
    float latency_ms = 8;
}

message StreamChunk {
    string request_id = 1;
    string text = 2;
    int32 token = 3;
    bool is_final = 4;
    string worker_id = 5;
}

// Worker registration and management
message WorkerRegistration {
    string worker_id = 1;
    string address = 2;
    DeviceInfo device_info = 3;
    int32 max_concurrent = 4;
    repeated string supported_models = 5;
}

message RegistrationResponse {
    bool success = 1;
    string message = 2;
    string coordinator_id = 3;
}

message DeviceInfo {
    string model = 1;
    int32 memory_gb = 2;
    int32 gpu_cores = 3;
    string os_version = 4;
    string mlx_version = 5;
}

// Health and monitoring
message HeartbeatRequest {
    string worker_id = 1;
    WorkerStatus status = 2;
    WorkerMetrics metrics = 3;
    repeated string supported_models = 4;  // Current list of loaded models
}

message HeartbeatResponse {
    bool acknowledged = 1;
    string message = 2;
    int32 heartbeat_interval = 3;
}

message WorkerStatus {
    string status = 1;  // healthy, unhealthy, draining
    int32 current_load = 2;
    float memory_usage_percent = 3;
    int64 uptime_seconds = 4;
}

message WorkerMetrics {
    float avg_latency_ms = 1;
    float tokens_per_second = 2;
    int32 total_requests = 3;
    int32 failed_requests = 4;
    int32 active_requests = 5;
    float memory_usage_gb = 6;
}

message HealthCheckRequest {
    bool include_workers = 1;
    bool include_sharded_models = 2;
}

message HealthCheckResponse {
    string status = 1;  // healthy, degraded, unhealthy
    int32 total_workers = 2;
    int32 healthy_workers = 3;
    int32 active_requests = 4;
    repeated WorkerHealthInfo worker_health = 5;
}

message WorkerHealthInfo {
    string worker_id = 1;
    string status = 2;
    float last_heartbeat_seconds = 3;
    int32 current_load = 4;
}

message HealthStatus {
    string status = 1;
    string message = 2;
    WorkerMetrics metrics = 3;
}

// Model management messages
message ModelDownloadRequest {
    string model_name = 1;
    bool force_redownload = 2;
    LayerAssignment layer_assignment = 3;  // Optional: for sharded downloads
    bool enable_sharding = 4;  // Enable automatic sharding
    int32 num_layers = 5;  // Number of layers (for local models)
    float model_size_gb = 6;  // Model size in GB (for local models)
}

// Layer assignment for sharded models
message LayerAssignment {
    string worker_id = 1;
    int32 start_layer = 2;
    int32 end_layer = 3;  // Exclusive
    string next_worker_id = 4;
    string next_worker_address = 5;
}

// Shard plan for distributed models
message ShardPlan {
    string model_name = 1;
    int32 total_layers = 2;
    repeated LayerAssignment assignments = 3;
}

message ModelDownloadResponse {
    bool success = 1;
    string message = 2;
    string download_id = 3;
    int32 workers_notified = 4;
    bool is_sharded = 5;
    ShardPlan shard_plan = 6;  // Optional: shard plan if sharding is enabled
}

message ModelStatusRequest {
    string model_name = 1;
    string download_id = 2;
}

message ModelStatusResponse {
    string model_name = 1;
    string status = 2;  // downloading, ready, failed, not_found
    float progress_percent = 3;
    int64 size_bytes = 4;
    repeated WorkerModelStatus worker_status = 5;
}

message WorkerModelStatus {
    string worker_id = 1;
    string status = 2;
    float progress_percent = 3;
    string error = 4;
}

// Model deletion messages
message ModelDeleteRequest {
    string model_name = 1;
}

message ModelDeleteResponse {
    bool success = 1;
    string message = 2;
    int32 workers_deleted = 3;
    repeated WorkerDeleteStatus worker_status = 4;
}

message WorkerDeleteStatus {
    string worker_id = 1;
    bool success = 2;
    string error = 3;
}

// Shard status messages
message ShardStatusRequest {
    string model_name = 1;
}

message ShardStatusResponse {
    bool is_sharded = 1;
    string model_name = 2;
    int32 total_layers = 3;
    string status = 4;  // downloading, ready, failed, partial
    repeated ShardAssignmentStatus shard_assignments = 5;
}

message ShardAssignmentStatus {
    string worker_id = 1;
    int32 start_layer = 2;
    int32 end_layer = 3;
    string download_status = 4;  // pending, in_progress, completed, failed
    string next_worker_id = 5;
}

// Utility messages
message Empty {}