version: '3.8'

services:
  # Redis for coordinator state persistence
  redis:
    image: redis:7-alpine
    container_name: mlx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mlx-network

  # Coordinator service
  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.coordinator
    container_name: mlx-coordinator
    restart: unless-stopped
    ports:
      - "50051:50051"  # gRPC port
      - "9091:9090"    # Metrics port
    environment:
      - GRPC_PORT=50051
      - METRICS_PORT=9090
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - MAX_WORKERS=100
      - HEALTH_CHECK_INTERVAL=30
      - WORKER_TIMEOUT=60
      - ENABLE_TRACING=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - SERVICE_NAME=mlx-coordinator
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config/worker.yaml:/app/config/worker.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=5); channel.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mlx-network

  # API server
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: mlx-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=2
      - LOG_LEVEL=info
      - COORDINATOR_HOST=coordinator:50051
      - ENABLE_AUTH=false
      - API_KEYS=${API_KEYS:-}
      - ENABLE_TRACING=true
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - SERVICE_NAME=mlx-api-server
      - ENVIRONMENT=docker
    depends_on:
      coordinator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - mlx-network

  # Nginx load balancer
  nginx:
    image: nginx:alpine
    container_name: mlx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlx-network

  # Monitoring stack (Prometheus + Grafana)
  monitoring:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitoring
    container_name: mlx-monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"  # Prometheus
      - "3000:3000"  # Grafana
    environment:
      - PROMETHEUS_RETENTION=15d
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - prometheus_data:/var/lib/prometheus/data
      - grafana_data:/var/lib/grafana/data
      - ./config/prometheus:/etc/prometheus:ro
      - ./config/grafana:/etc/grafana:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9090/-/healthy && curl -f http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - mlx-network

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: mlx-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlx-network

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  mlx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16