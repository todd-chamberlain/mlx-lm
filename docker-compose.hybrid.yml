version: '3.8'

# Hybrid deployment: Docker services + Native MLX workers
# Coordinator, API, and monitoring run in Docker
# Workers run natively on Mac Studios to access Apple Silicon GPU

services:
  # Redis for coordinator state persistence
  redis:
    image: redis:7-alpine
    container_name: mlx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      mlx-network:
        ipv4_address: 172.20.0.2

  # Coordinator service (Docker)
  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    container_name: mlx-coordinator
    restart: unless-stopped
    ports:
      - "50051:50051"  # gRPC port (exposed to host for native workers)
      - "9091:9090"    # Metrics port
    environment:
      - GRPC_PORT=50051
      - GRPC_HOST=0.0.0.0  # Listen on all interfaces for external workers
      - METRICS_PORT=9090
      - LOG_LEVEL=INFO
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - MAX_WORKERS=100
      - HEALTH_CHECK_INTERVAL=30
      - WORKER_TIMEOUT=60
      - ENABLE_AUTO_SHARDING=true
      - SHARD_THRESHOLD_GB=30
      - SERVICE_NAME=mlx-coordinator
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=5); channel.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      mlx-network:
        ipv4_address: 172.20.0.3

  # API server (Docker)
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: mlx-api
    restart: unless-stopped
    ports:
      - "8000:8000"  # API port (exposed to host)
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=2
      - LOG_LEVEL=info
      - COORDINATOR_HOST=coordinator:50051
      - ENABLE_AUTH=false
      - SERVICE_NAME=mlx-api-server
      - ENVIRONMENT=hybrid
    depends_on:
      coordinator:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      mlx-network:
        ipv4_address: 172.20.0.4

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: mlx-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      mlx-network:
        ipv4_address: 172.20.0.5

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: mlx-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      mlx-network:
        ipv4_address: 172.20.0.6

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  mlx-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
